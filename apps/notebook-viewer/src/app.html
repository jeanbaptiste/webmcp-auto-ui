<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Public notebook viewer — nb.hyperskills.net" />
    <meta property="og:site_name" content="nb.hyperskills.net" />
    <!--
      ESM import map — bare-specifier resolution for libs marked external in
      vite.config.ts. Versions are pinned to what's installed in node_modules
      (see package.json / lockfile). The viewer code itself doesn't import
      these directly; widget renderers (chart, markdown, export) inside
      @webmcp-auto-ui/ui and the optional nano-rag embedder load them on
      demand via dynamic import().
    -->
    <script type="importmap">
      {
        "imports": {
          "vega-embed": "https://esm.sh/vega-embed@6.29.0",
          "marked": "https://esm.sh/marked@16.4.2",
          "highlight.js": "https://esm.sh/highlight.js@10.7.3",
          "html-to-image": "https://esm.sh/html-to-image@1.11.13",
          "onnxruntime-web": "https://esm.sh/onnxruntime-web@1.21.0",
          "@huggingface/transformers": "https://esm.sh/@huggingface/transformers@4.1.0",

          "cesium": "https://esm.sh/cesium@1.140.0",
          "maplibre-gl": "https://esm.sh/maplibre-gl@4.7.1",
          "mapbox-gl": "https://esm.sh/mapbox-gl@1.13.1",
          "leaflet": "https://esm.sh/leaflet@1.9.4",
          "pmtiles": "https://esm.sh/pmtiles@4.4.1",
          "s2js": "https://esm.sh/s2js@1.44.0",

          "@here/harp-mapview": "https://esm.sh/@here/harp-mapview@0.28.0",
          "@here/harp-datasource-protocol": "https://esm.sh/@here/harp-datasource-protocol@0.28.0",
          "@here/harp-map-controls": "https://esm.sh/@here/harp-map-controls@0.28.0",
          "@here/harp-omv-datasource": "https://esm.sh/@here/harp-omv-datasource@0.28.0",

          "plotly.js-dist-min": "https://esm.sh/plotly.js-dist-min@2.35.3",
          "mermaid": "https://esm.sh/mermaid@11.14.0",
          "@antv/g6": "https://esm.sh/@antv/g6@5.1.0",

          "three": "https://esm.sh/three@0.168.0",
          "three/": "https://esm.sh/three@0.168.0/",
          "pixi.js": "https://esm.sh/pixi.js@8.18.1",

          "deck.gl": "https://esm.sh/deck.gl@9.3.1",
          "@deck.gl/core": "https://esm.sh/@deck.gl/core@9.3.1",
          "@deck.gl/layers": "https://esm.sh/@deck.gl/layers@9.3.1",
          "@deck.gl/aggregation-layers": "https://esm.sh/@deck.gl/aggregation-layers@9.3.1",
          "@deck.gl/geo-layers": "https://esm.sh/@deck.gl/geo-layers@9.3.1",
          "@deck.gl/mapbox": "https://esm.sh/@deck.gl/mapbox@9.3.1",
          "@deck.gl/mesh-layers": "https://esm.sh/@deck.gl/mesh-layers@9.3.1",
          "@luma.gl/engine": "https://esm.sh/@luma.gl/engine@9.2.0",

          "@finos/perspective/dist/esm/perspective.inline.js": "https://cdn.jsdelivr.net/npm/@finos/perspective@3.8.0/dist/esm/perspective.inline.js",
          "@finos/perspective-viewer/dist/esm/perspective-viewer.inline.js": "https://cdn.jsdelivr.net/npm/@finos/perspective-viewer@3.8.0/dist/esm/perspective-viewer.inline.js"
        }
      }
    </script>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('nb-theme');
          if (t === 'dark') document.documentElement.dataset.theme = 'dark';
        } catch (e) {}
      })();
    </script>
    %sveltekit.head%
  </head>
  <body>
    <div>%sveltekit.body%</div>
  </body>
</html>
